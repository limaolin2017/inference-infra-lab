<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif">
  <style>.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.p{fill:#FAECE7;stroke:#993C1D}.d{fill:#E1F5EE;stroke:#0F6E56}</style>
  <rect width="680" height="260" fill="#ffffff"/>
  <text x="40" y="28" class="th">Without chunking: one huge prefill step</text>
  <text x="40" y="58" class="ts">step</text>
  <g stroke-width="0.5"><rect x="90" y="42" width="24" height="24" rx="3" class="d"/><rect x="120" y="42" width="300" height="24" rx="3" class="p"/><rect x="426" y="42" width="24" height="24" rx="3" class="d"/></g>
  <text x="270" y="59" text-anchor="middle" class="ts">10,000-token prefill</text>
  <text x="460" y="59" class="ts">chat users wait → TPOT spike</text>
  <text x="40" y="118" class="th">Chunked prefill: each step = decode tokens + one chunk</text>
  <g stroke-width="0.5">
    <rect x="90" y="134" width="24" height="24" rx="3" class="d"/><rect x="116" y="134" width="70" height="24" rx="3" class="p"/>
    <rect x="200" y="134" width="24" height="24" rx="3" class="d"/><rect x="226" y="134" width="70" height="24" rx="3" class="p"/>
    <rect x="310" y="134" width="24" height="24" rx="3" class="d"/><rect x="336" y="134" width="70" height="24" rx="3" class="p"/>
    <rect x="420" y="134" width="24" height="24" rx="3" class="d"/><rect x="446" y="134" width="70" height="24" rx="3" class="p"/>
  </g>
  <text x="40" y="151" class="ts">steps</text>
  <text x="530" y="151" class="ts">smooth TPOT</text>
  <rect x="90" y="190" width="18" height="18" rx="3" class="d" stroke-width="0.5"/><text x="116" y="203" class="ts">decode tokens (chat users, 1 each)</text>
  <rect x="350" y="190" width="18" height="18" rx="3" class="p" stroke-width="0.5"/><text x="376" y="203" class="ts">prefill chunk (part of the long prompt)</text>
  <text x="40" y="240" class="ts">Chunk size = per-step token cap (max_num_batched_tokens) − decode tokens in that step</text>
</svg>
