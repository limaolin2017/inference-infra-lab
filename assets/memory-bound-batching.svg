<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#2C2C2A">Concept example — not a measurement</text>
  <rect x="40" y="44" width="180" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="72" text-anchor="middle" font-size="14" fill="#2C2C2A">HBM (GPU memory)</text>
  <text x="130" y="94" text-anchor="middle" font-size="12" fill="#5F5E5A">big, slow</text>
  <text x="130" y="112" text-anchor="middle" font-size="12" fill="#5F5E5A">weights + KV cache</text>
  <line x1="224" y1="86" x2="300" y2="86" stroke="#D85A30" stroke-width="3" marker-end="url(#a)"/>
  <text x="262" y="74" text-anchor="middle" font-size="12" fill="#993C1D">bandwidth</text>
  <rect x="306" y="44" width="140" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="376" y="72" text-anchor="middle" font-size="14" fill="#712B13">SRAM</text>
  <text x="376" y="94" text-anchor="middle" font-size="12" fill="#993C1D">small, very fast</text>
  <line x1="450" y1="86" x2="486" y2="86" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="492" y="44" width="148" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="566" y="72" text-anchor="middle" font-size="14" fill="#085041">Compute cores</text>
  <text x="566" y="94" text-anchor="middle" font-size="12" fill="#0F6E56">mostly waiting</text>
  <text x="566" y="112" text-anchor="middle" font-size="12" fill="#0F6E56">in small-batch decode</text>
  <line x1="80" y1="270" x2="620" y2="270" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
  <line x1="80" y1="270" x2="80" y2="152" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
  <text x="615" y="290" text-anchor="end" font-size="12" fill="#5F5E5A">batch size</text>
  <text x="88" y="160" font-size="12" fill="#5F5E5A">throughput (all users, tokens/s)</text>
  <path d="M80 266 L330 186 L600 186" fill="none" stroke="#D85A30" stroke-width="2.5"/>
  <line x1="330" y1="186" x2="330" y2="270" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <circle cx="330" cy="186" r="4" fill="#D85A30"/>
  <text x="340" y="180" font-size="12" fill="#2C2C2A">turning point</text>
  <text x="200" y="250" text-anchor="middle" font-size="12" fill="#2C2C2A">memory-bound: step time ~flat</text>
  <text x="465" y="214" text-anchor="middle" font-size="12" fill="#2C2C2A">compute-bound: step time rises</text>
</svg>
