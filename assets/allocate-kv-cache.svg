<text x="435" y="114" font-size="12" fill="#085041" text-anchor="middle">④ KV budget → ⑤ N blocks, each = block_bytes</text>
<text x="40" y="165" font-size="12" fill="#5F5E5A" text-anchor="start">K</text>
