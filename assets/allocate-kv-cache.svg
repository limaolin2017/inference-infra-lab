<line x1="150" y1="222" x2="150" y2="246" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="250" width="240" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="180" y="273" font-size="12" fill="#3C3489" text-anchor="middle">⑥ Attention layer 0: k_cache, v_cache</text>
<text x="40" y="318" font-size="13" fill="#2C2C2A" text-anchor="start">① gpu_memory_utilization = 0.9 → use total × 0.9</text>
<text x="40" y="336" font-size="13" fill="#2C2C2A" text-anchor="start">② used = total − free (weights loaded)</text>
<text x="40" y="354" font-size="13" fill="#2C2C2A" text-anchor="start">③ warmup run with the biggest batch → peak temp memory</text>
<text x="40" y="372" font-size="13" fill="#2C2C2A" text-anchor="start">④ budget = total × 0.9 − used − peak + current</text>
<text x="40" y="390" font-size="13" fill="#2C2C2A" text-anchor="start">⑤ num_blocks = budget // block_bytes</text>
<text x="40" y="408" font-size="13" fill="#2C2C2A" text-anchor="start">⑥ one big tensor, once; each layer gets its K and V slice</text>
</svg>
