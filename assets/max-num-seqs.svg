<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif">
<title>max_num_seqs as seats in running</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<rect x="40" y="40" width="170" height="90" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="125" y="64" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">waiting</text>
<g font-size="14" font-weight="bold" fill="#444441" text-anchor="middle">
<circle cx="80" cy="100" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="80" y="105">E</text>
<circle cx="125" cy="100" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="125" y="105">F</text>
<circle cx="170" cy="100" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="170" y="105">G</text>
</g>
<line x1="214" y1="95" x2="246" y2="95" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="40" width="230" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="365" y="64" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">running: 4 seats</text>
<g font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">
<rect x="262" y="80" width="40" height="32" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><text x="282" y="101">A</text>
<rect x="316" y="80" width="40" height="32" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><text x="336" y="101">B</text>
<rect x="370" y="80" width="40" height="32" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><text x="390" y="101">C</text>
<rect x="424" y="80" width="40" height="32" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><text x="444" y="101">D</text>
</g>
<line x1="484" y1="95" x2="511" y2="95" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="515" y="40" width="125" height="90" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="577" y="72" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">One step</text>
<text x="577" y="96" font-size="12" fill="#5F5E5A" text-anchor="middle">1 token each</text>
<text x="577" y="114" font-size="12" fill="#5F5E5A" text-anchor="middle">reads their K/V</text>
<text x="340" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle">max_num_seqs = 4 → at most 4 requests in running at once</text>
<rect x="40" y="175" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="180" y="202" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Raise it (more seats)</text>
<text x="180" y="228" font-size="12" fill="#5F5E5A" text-anchor="middle">More users served together</text>
<text x="180" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle">Throughput up</text>
<text x="180" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">Cost: more K/V per step → TPOT slower</text>
<rect x="360" y="175" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="500" y="202" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Lower it (fewer seats)</text>
<text x="500" y="228" font-size="12" fill="#5F5E5A" text-anchor="middle">Fewer users per step</text>
<text x="500" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle">TPOT faster</text>
<text x="500" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">Cost: longer queue → TTFT slower</text>
</svg>
