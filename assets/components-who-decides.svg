<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="200elvetica, Arial, sans-serif">
  <style>.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.gray{fill:#F1EFE8;stroke:#5F5E5A}.teal{fill:#E1F5EE;stroke:#0F6E56}.coral{fill:#FAECE7;stroke:#993C1D}.purple{fill:#EEEDFE;stroke:#534AB7}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
  <rect width="680" height="200" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" marker200eight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <rect x="40" y="30" width="140" height="56" rx="8" class="coral" stroke-width="1"/><text x="110" y="54" text-anchor="middle" class="th">Scheduler</text><text x="110" y="74" text-anchor="middle" class="ts">decides</text>
  <rect x="250" y="30" width="160" height="56" rx="8" class="gray" stroke-width="0.5"/><text x="330" y="54" text-anchor="middle" class="th">KV Cache Manager</text><text x="330" y="74" text-anchor="middle" class="ts">blocks or None</text>
  <rect x="480" y="30" width="160" height="56" rx="8" class="gray" stroke-width="0.5"/><text x="560" y="54" text-anchor="middle" class="th">BlockPool</text><text x="560" y="74" text-anchor="middle" class="ts">takes, returns</text>
  <rect x="250" y="120" width="160" height="56" rx="8" class="gray" stroke-width="0.5"/><text x="330" y="144" text-anchor="middle" class="th">Model Runner</text><text x="330" y="164" text-anchor="middle" class="ts">runs the GPU step</text>
  <line x1="180" y1="58" x2="246" y2="58" class="arr" marker-end="url(#a)"/>
  <line x1="410" y1="58" x2="476" y2="58" class="arr" marker-end="url(#a)"/>
  <path d="M110 86 L110 148 L246 148" class="arr" marker-end="url(#a)"/>
  <text x="480" y="152" class="ts">Coral = decides</text><text x="480" y="170" class="ts">Gray = only answers or does</text>
</svg>
