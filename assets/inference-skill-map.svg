<text x="60" y="493" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#bfdbfe">Track A — Serving / Platform</text>
<text x="60" y="521" font-family="Arial,sans-serif" font-size="16" fill="#f8fafc">Docker · Kubernetes · queues · reliability</text>
