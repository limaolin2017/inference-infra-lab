<text x="676" y="521" font-family="Arial,sans-serif" font-size="16" fill="#f8fafc">GPU profiling · batching · KV · CUDA / Triton</text>
<text x="676" y="549" font-family="Arial,sans-serif" font-size="15" fill="#cbd5e1">Portfolio: bottleneck → change → measured gain</text>
<text x="676" y="580" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Example: Featherless — Inference Optimization</text><text x="40" y="648" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">PARKING LOT — learn only when a job or experiment needs it</text><rect x="40" y="665" width="1200" height="80" rx="14" fill="#192131" stroke="#475569"/>
<text x="60" y="693" font-family="Arial,sans-serif" font-size="17" fill="#e2e8f0">2Q / ARC deep policy design  ·  EAGLE lookahead corner cases  ·  RDMA / MoE / multi-node</text>
<text x="60" y="725" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8">Rule: only pursue if it unlocks a P0 proof or the target job explicitly needs it.</text>
