<title id="title">Inference Engineer Knowledge Map</title>
<desc id="desc">Job-ready inference engineer main path from serving and scheduling through KV manager, model runner, NVIDIA GPU and profiling. Current study progress and gaps. Advanced cache policies and EAGLE are deferred.</desc>
