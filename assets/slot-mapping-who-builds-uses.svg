<text x="30" y="312" font-size="13" fill="#2C2C2A">① KV Cache Manager gives request A blocks 7 and 3 → block_table</text>
<text x="30" y="334" font-size="13" fill="#2C2C2A">② Model Runner: the new token goes to slot 12 → slot_mapping</text>
<text x="30" y="356" font-size="13" fill="#2C2C2A">③ Attention WRITES the new K/V into slot 12 (uses slot_mapping)</text>
<text x="30" y="378" font-size="13" fill="#2C2C2A">④ Attention READS old K/V from blocks 7 and 3 (uses block_table)</text>
<text x="484" y="294" font-size="12" fill="#5F5E5A">gray = old K/V · orange = new K/V</text>
</svg>
