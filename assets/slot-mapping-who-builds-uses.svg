<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif">
<title>Who builds and uses slot_mapping vs block_table</title>
<defs><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="130.0" y="66" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">① KV Cache Manager</text>
<text x="130.0" y="86" font-size="12" fill="#534AB7" text-anchor="middle">gives blocks</text>
<rect x="30" y="130" width="200" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="130.0" y="156" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">② Model Runner</text>
<text x="130.0" y="176" font-size="12" fill="#534AB7" text-anchor="middle">builds slot_mapping</text>
<rect x="30" y="220" width="200" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="130.0" y="246" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">③④ Attention kernel</text>
<text x="130.0" y="266" font-size="12" fill="#534AB7" text-anchor="middle">writes + reads K/V</text>
<rect x="260" y="40" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="350.0" y="66" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">block_table (A)</text>
<text x="350.0" y="86" font-size="12" fill="#0F6E56" text-anchor="middle">[7, 3] → READ old K/V</text>
<rect x="260" y="130" width="180" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="350.0" y="156" font-size="14" font-weight="bold" fill="#633806" text-anchor="middle">slot_mapping</text>
<text x="350.0" y="176" font-size="12" fill="#854F0B" text-anchor="middle">new token → [12] → WRITE</text>
<line x1="444" y1="142" x2="486" y2="142" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aw)"/>
<text x="560" y="28" font-size="12" fill="#5F5E5A" text-anchor="middle">GPU KV cache</text>
