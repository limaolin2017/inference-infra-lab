<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
<title>How the Block Table maps token 10 to a physical KV slot</title>
<desc>Token 10 is in logical block 0 at offset 10. Block Table entry 0 points to physical block 3. So token 10 is stored in physical block 3, slot 10. Concept example, not a trace or measurement.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" rx="8" fill="#FFFFFF"/>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Logical</text>
<rect x="170" y="44" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250.0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Logical block 0</text><text x="250.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">tokens 0–15</text>
<rect x="410" y="44" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="490.0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Logical block 1</text><text x="490.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">tokens 16–31</text>
<line x1="250" y1="102" x2="250" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="102" x2="490" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="262" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">token 10: 10 ÷ 16 = block 0</text>
<text x="40" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Block Table</text>
<rect x="170" y="140" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250.0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">table[0] = 3</text><text x="250.0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">→ physical block 3</text>
<rect x="410" y="140" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="490.0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">table[1] = 7</text><text x="490.0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">→ physical block 7</text>
<line x1="250" y1="198" x2="250" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="198" x2="490" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="262" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">offset 10 = slot 10</text>
