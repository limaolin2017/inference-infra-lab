<text x="250" y="261" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="283" y="236" width="54" height="50" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="310" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="343" y="236" width="54" height="50" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="370" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="403" y="236" width="54" height="50" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="430" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">6</text>
<rect x="463" y="236" width="54" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="490" y="261" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">7</text>
<rect x="523" y="236" width="54" height="50" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="550" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">8</text>
<rect x="583" y="236" width="54" height="50" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="610" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">9</text>
<text x="340" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Physical: KV Cache pool (gray = other requests)</text>
</svg>
