<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="300elvetica, Arial, sans-serif">
  <style>.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.gray{fill:#F1EFE8;stroke:#5F5E5A}.teal{fill:#E1F5EE;stroke:#0F6E56}.coral{fill:#FAECE7;stroke:#993C1D}.purple{fill:#EEEDFE;stroke:#534AB7}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
  <rect width="680" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" marker300eight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <text x="40" y="30" class="ts">GPU memory × gpu_memory_utilization</text>
  <rect x="40" y="44" width="120" height="56" rx="4" class="gray" stroke-width="0.5"/><text x="100" y="68" text-anchor="middle" class="th">Weights</text><text x="100" y="88" text-anchor="middle" class="ts">fixed</text>
  <rect x="164" y="44" width="80" height="56" rx="4" class="gray" stroke-width="0.5"/><text x="204" y="68" text-anchor="middle" class="th">Activ.</text><text x="204" y="88" text-anchor="middle" class="ts">peak</text>
  <rect x="248" y="44" width="340" height="56" rx="4" class="teal" stroke-width="0.5"/><text x="418" y="68" text-anchor="middle" class="th">KV cache budget</text><text x="418" y="88" text-anchor="middle" class="ts">what is left → blocks</text>
  <rect x="592" y="44" width="48" height="56" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/><text x="616" y="76" text-anchor="middle" class="ts">rest</text>
  <line x1="418" y1="104" x2="418" y2="140" class="arr" marker-end="url(#a)"/>
  <rect x="268" y="144" width="300" height="44" rx="8" class="teal" stroke-width="0.5"/><text x="418" y="171" text-anchor="middle" class="th">÷ KV bytes per token = max tokens</text>
  <line x1="418" y1="188" x2="418" y2="222" class="arr" marker-end="url(#a)"/>
  <rect x="268" y="226" width="300" height="44" rx="8" class="purple" stroke-width="0.5"/><text x="418" y="253" text-anchor="middle" class="th">÷ tokens per request = max requests</text>
  <text x="40" y="171" class="ts">Hotel: staff rooms = weights,</text><text x="40" y="189" class="ts">guest rooms = KV budget</text>
