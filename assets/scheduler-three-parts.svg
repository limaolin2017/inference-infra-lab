<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="230elvetica, Arial, sans-serif">
  <style>.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.gray{fill:#F1EFE8;stroke:#5F5E5A}.teal{fill:#E1F5EE;stroke:#0F6E56}.coral{fill:#FAECE7;stroke:#993C1D}.purple{fill:#EEEDFE;stroke:#534AB7}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
  <rect width="680" height="230" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" marker230eight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <text x="340" y="24" text-anchor="middle" class="ts">Scheduler — 3 key parts (restaurant: line at the door / tables / host)</text>
  <rect x="30" y="40" width="190" height="120" rx="10" class="teal" stroke-width="0.5"/>
  <text x="125" y="62" text-anchor="middle" class="th">1. waiting</text><text x="125" y="80" text-anchor="middle" class="ts">deque · not started yet</text>
  <rect x="50" y="98" width="40" height="30" rx="4" class="purple" stroke-width="0.5"/><text x="70" y="118" text-anchor="middle" class="ts">B</text>
  <rect x="100" y="98" width="40" height="30" rx="4" class="purple" stroke-width="0.5"/><text x="120" y="118" text-anchor="middle" class="ts">C</text>
  <text x="70" y="148" text-anchor="middle" class="ts">front</text><text x="175" y="148" text-anchor="middle" class="ts">end</text>
  <rect x="245" y="40" width="190" height="120" rx="10" class="teal" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" class="th">2. running</text><text x="340" y="80" text-anchor="middle" class="ts">list · in the GPU batch now</text>
  <rect x="320" y="98" width="40" height="30" rx="4" class="purple" stroke-width="0.5"/><text x="340" y="118" text-anchor="middle" class="ts">A</text>
  <rect x="460" y="40" width="190" height="120" rx="10" class="gray" stroke-width="0.5"/>
  <text x="555" y="62" text-anchor="middle" class="th">3. kv_cache_manager</text><text x="555" y="80" text-anchor="middle" class="ts">gives out / takes back blocks</text>
  <rect x="490" y="98" width="24" height="24" rx="3" class="purple" stroke-width="0.5"/><rect x="520" y="98" width="24" height="24" rx="3" class="purple" stroke-width="0.5"/><rect x="550" y="98" width="24" height="24" rx="3" fill="#fff" stroke="#5F5E5A" stroke-width="0.5"/><rect x="580" y="98" width="24" height="24" rx="3" fill="#fff" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="125" y="186" text-anchor="middle" class="ts">new → add_request() → end</text>
  <text x="125" y="204" text-anchor="middle" class="ts">preempted → prepend_request() → front</text>
  <text x="340" y="186" text-anchor="middle" class="ts">only the Scheduler decides</text>
  <text x="555" y="186" text-anchor="middle" class="ts">answers: blocks or None</text>
</svg>
